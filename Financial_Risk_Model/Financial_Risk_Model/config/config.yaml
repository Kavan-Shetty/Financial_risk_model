# ============================================================
# Financial Risk Model — Configuration
# ============================================================

project:
  name: "Financial Risk Model"
  version: "1.0.0"
  description: "ML-based credit/financial risk classification pipeline"
  random_state: 42

# ----------------------------------------------------------
# Data paths
# ----------------------------------------------------------
data:
  raw_path: "data/raw/financial_risk_data.csv"
  processed_path: "data/processed/processed_data.csv"
  test_size: 0.20
  validation_size: 0.10           # fraction of training set used for val

# ----------------------------------------------------------
# Target column
# ----------------------------------------------------------
target:
  column: "RiskFlag"              # 1 = high risk / default, 0 = low risk
  positive_label: 1

# ----------------------------------------------------------
# Feature groups
# ----------------------------------------------------------
features:
  # Raw numeric features present in the dataset
  numeric:
    - "Income"
    - "Age"
    - "LoanAmount"
    - "LoanTenure"
    - "CreditScore"
    - "ExistingLoansCount"
    - "MonthlyEMI"
    - "TotalAssets"
    - "TotalLiabilities"
    - "NetMonthlyIncome"

  # Raw categorical features
  categorical:
    - "EmploymentType"
    - "MaritalStatus"
    - "EducationLevel"
    - "PropertyOwnership"
    - "LoanPurpose"

  # Engineered features (created in feature_engineering.py)
  engineered:
    - "DebtToIncome"
    - "LoanToIncome"
    - "EMIToIncome"
    - "AssetToLiability"
    - "CreditScoreBin"
    - "AgeBin"
    - "LoanAmountBin"
    - "NetWorth"
    - "FinancialStressIndex"
    - "LoanBurdenRatio"

# ----------------------------------------------------------
# Preprocessing
# ----------------------------------------------------------
preprocessing:
  scaling_strategy: "standard"    # "standard" | "minmax" | "robust"
  handle_outliers: true
  outlier_method: "iqr"           # "iqr" | "zscore"
  outlier_threshold: 3.0
  imputation_strategy: "median"   # for numeric; categorical uses "most_frequent"
  encode_strategy: "onehot"       # "onehot" | "label"

# ----------------------------------------------------------
# Model training
# ----------------------------------------------------------
models:
  logistic_regression:
    enabled: true
    params:
      C: 1.0
      max_iter: 1000
      solver: "lbfgs"
      class_weight: "balanced"

  random_forest:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      class_weight: "balanced"
      n_jobs: -1

  gradient_boosting:
    enabled: true
    params:
      n_estimators: 200
      learning_rate: 0.05
      max_depth: 5
      subsample: 0.8
      min_samples_split: 5

# ----------------------------------------------------------
# Hyperparameter tuning
# ----------------------------------------------------------
tuning:
  method: "grid_search"           # "grid_search" | "random_search"
  cv_folds: 5
  scoring: "roc_auc"
  n_jobs: -1

  random_forest_grid:
    n_estimators: [100, 200, 300]
    max_depth: [5, 10, 15, null]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]

  gradient_boosting_grid:
    n_estimators: [100, 200]
    learning_rate: [0.01, 0.05, 0.1]
    max_depth: [3, 5, 7]
    subsample: [0.7, 0.8, 1.0]

# ----------------------------------------------------------
# Evaluation
# ----------------------------------------------------------
evaluation:
  threshold: 0.50                 # classification threshold
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
    - "confusion_matrix"
  save_plots: true
  plots_dir: "reports/figures"

# ----------------------------------------------------------
# Artifacts
# ----------------------------------------------------------
artifacts:
  model_dir: "models"
  best_model_name: "risk_model.pkl"
  preprocessor_name: "preprocessor.pkl"
  feature_names_file: "feature_names.json"
